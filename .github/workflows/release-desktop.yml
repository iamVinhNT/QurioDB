# @file release-desktop.yml
# @description Build native Tauri desktop bundles and publish a stable release for semver tags.

name: Release desktop

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate and package without a leading v
        required: true
        type: string
      platform:
        description: Native platform to preflight manually
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Validate tag matches tracked version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$REQUESTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'Release tags must match vX.Y.Z exactly: %s\n' "$REQUESTED_VERSION" >&2
              exit 1
            fi
            VERSION="${REQUESTED_VERSION#v}"
          else
            if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'Manual versions must match X.Y.Z exactly: %s\n' "$REQUESTED_VERSION" >&2
              exit 1
            fi
            VERSION="$REQUESTED_VERSION"
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'QURIODB_VERSION=%s\n' "$VERSION" > .env
          bun run version:check

  build-windows:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    needs: validate
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun download artifacts
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-targets: true
          key: windows-msvc
      - name: Prepare version and Python environment
        shell: pwsh
        run: |
          "QURIODB_VERSION=$env:RELEASE_VERSION" | Set-Content -NoNewline .env
          python -m venv apps/api/venv
      - name: Install JavaScript dependencies and validate version
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          bun run version:check
      - name: Build Windows FastAPI sidecar
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File ./build-backend.ps1 -Target msvc
          if (-not (Test-Path 'apps/desktop/src-tauri/bin/api-x86_64-pc-windows-msvc.exe')) {
            throw 'Expected Windows MSVC sidecar was not produced'
          }
      - name: Smoke-test Windows FastAPI sidecar
        shell: pwsh
        run: |
          function Write-SidecarLogs {
            param(
              [string]$stdoutPath,
              [string]$stderrPath
            )
            Write-Host 'Windows sidecar stdout:'
            if (Test-Path -LiteralPath $stdoutPath) {
              Get-Content -LiteralPath $stdoutPath
            }
            Write-Host 'Windows sidecar stderr:'
            if (Test-Path -LiteralPath $stderrPath) {
              Get-Content -LiteralPath $stderrPath
            }
          }

          $binary = Join-Path $pwd 'apps/desktop/src-tauri/bin/api-x86_64-pc-windows-msvc.exe'
          $port = python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()'
          $env:QURIODB_DESKTOP_PORT = $port.Trim()
          $env:QURIODB_STARTUP_NONCE = [guid]::NewGuid().ToString('N')
          $env:QURIODB_DESKTOP_PARENT_PID = $PID
          $stdoutLog = Join-Path $env:RUNNER_TEMP "quriodb-sidecar-$PID.stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "quriodb-sidecar-$PID.stderr.log"
          $process = $null
          try {
            $process = Start-Process -FilePath $binary -PassThru `
              -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
            $healthy = $false
            for ($attempt = 0; $attempt -lt 180; $attempt++) {
              if ($process.HasExited) {
                throw "Windows sidecar exited with code $($process.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest -UseBasicParsing `
                  -Uri "http://127.0.0.1:$($env:QURIODB_DESKTOP_PORT)/api/desktop/health" `
                  -Headers @{ 'X-QurioDB-Startup-Nonce' = $env:QURIODB_STARTUP_NONCE }
              } catch {
                Start-Sleep -Milliseconds 500
                continue
              }
              if ($response.StatusCode -ne 200) {
                Start-Sleep -Milliseconds 500
                continue
              }
              try {
                $body = $response.Content | ConvertFrom-Json
              } catch {
                throw 'Windows sidecar returned malformed desktop health JSON'
              }
              $properties = @($body.PSObject.Properties)
              if ($properties.Count -ne 2 -or $body.status -ne 'ok' -or $body.service -ne 'quriodb-desktop') {
                throw 'Windows sidecar returned an invalid desktop health body'
              }
              $healthy = $true
              break
            }
            if (-not $healthy) {
              throw 'Windows sidecar did not return a healthy /api/desktop/health response within 90 seconds'
            }
          } catch {
            Write-SidecarLogs -stdoutPath $stdoutLog -stderrPath $stderrLog
            throw
          } finally {
            if ($process) {
              try {
                & taskkill.exe /F /T /PID $process.Id | Out-Null
                if ($LASTEXITCODE -ne 0) {
                  Write-Warning "taskkill failed for Windows sidecar PID $($process.Id)"
                }
              } catch {
                Write-Warning "Could not clean up Windows sidecar PID $($process.Id): $($_.Exception.Message)"
              }
            }
            Remove-Item Env:QURIODB_DESKTOP_PORT -ErrorAction SilentlyContinue
            Remove-Item Env:QURIODB_STARTUP_NONCE -ErrorAction SilentlyContinue
            Remove-Item Env:QURIODB_DESKTOP_PARENT_PID -ErrorAction SilentlyContinue
          }
      - name: Build Windows MSI and NSIS bundles
        shell: pwsh
        run: |
          Set-Location apps/desktop
          bun run tauri build --target x86_64-pc-windows-msvc
      - name: Collect Windows release assets
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/QurioDB_${version}_x64_en-US.msi" release-assets/
          Copy-Item "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/QurioDB_${version}_x64-setup.exe" release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    needs: validate
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun download artifacts
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-targets: true
          key: linux-gnu
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Prepare version and Python environment
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"
          printf 'QURIODB_VERSION=%s\n' "$VERSION" > .env
          python -m venv apps/api/venv
      - name: Install JavaScript dependencies and validate version
        run: |
          bun install --frozen-lockfile
          bun run version:check
      - name: Build Linux FastAPI sidecar
        run: |
          bash apps/desktop/scripts/build-sidecar.sh
          test -x apps/desktop/src-tauri/bin/api-x86_64-unknown-linux-gnu
      - name: Smoke-test Linux FastAPI sidecar
        shell: bash
        run: |
          set -euo pipefail
          BINARY="apps/desktop/src-tauri/bin/api-x86_64-unknown-linux-gnu"
          PORT="$(python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          export QURIODB_DESKTOP_PORT="$PORT"
          cleanup() {
            if [[ -n "${SIDECAR_PID:-}" ]] && kill -0 "$SIDECAR_PID" 2>/dev/null; then
              kill "$SIDECAR_PID" 2>/dev/null || true
              wait "$SIDECAR_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          "$BINARY" >"$RUNNER_TEMP/quriodb-sidecar.log" 2>&1 &
          SIDECAR_PID=$!
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error "http://127.0.0.1:$PORT/health" >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$SIDECAR_PID" 2>/dev/null; then
              printf 'Linux sidecar exited before /health became ready\n' >&2
              exit 1
            fi
            sleep 0.5
          done
          printf 'Linux sidecar did not return a healthy /health response\n' >&2
          exit 1
      - name: Build Linux DEB and AppImage bundles
        run: |
          bun run version:sync
          (cd apps/desktop && bun run tauri build --target x86_64-unknown-linux-gnu)
      - name: Collect Linux release assets
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"
          mkdir -p release-assets
          cp "apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/QurioDB_${VERSION}_amd64.deb" release-assets/
          cp "apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/QurioDB_${VERSION}_amd64.AppImage" release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release-assets'
          merge-multiple: true
          path: release-assets
      - name: Verify release tag is unused and points to this workflow commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'Release already exists; refusing to modify or overwrite %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          remote_sha="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$GITHUB_REF_NAME^{}" | awk 'NR == 1 {print $1}')"
          if [[ -z "$remote_sha" ]]; then
            remote_sha="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          fi
          if [[ -z "$remote_sha" || "$remote_sha" != "$GITHUB_SHA" ]]; then
            printf 'Release tag %s does not resolve to workflow commit %s (got %s)\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "${remote_sha:-missing}" >&2
            exit 1
          fi

      - name: Create stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "release-v$VERSION" \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes
